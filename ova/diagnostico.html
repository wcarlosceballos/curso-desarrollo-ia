<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>🩺 Diagnóstico</title>
<link rel="stylesheet" href="css/style.css"></head>
<body><aside class="sidebar">
<h2>🤖 Desarrollo con IA</h2>
<a href="index.html">🏠 Inicio</a>
<a href="diagnostico.html">🩺 Diagnóstico</a>
<a href="modulo1/index.html">📘 Módulo 1</a>
<a href="modulo2/index.html">📗 Módulo 2</a>
<a href="modulo3/index.html">📘 Módulo 3</a>
</aside>
<div class="main"><header><h1>🩺 Evaluación diagnóstica</h1></header>
<main>
<p>No genera nota. Determina tu nivel inicial y recomienda una ruta.</p>
<div id="quiz"></div>
<button class="btn" onclick="enviar()">Finalizar diagnóstico</button>
<p id="resultado"></p>
</main>
<footer>OVA educativo — Carlos Ceballos · 2026</footer></div>
<script src="js/storage.js"></script>
<script>
const preguntas = [
 {p:'1. ¿Qué es un LLM?', o:['Un robot que piensa','Un modelo que predice el siguiente token por probabilidad','Un buscador de internet'], c:1},
 {p:'2. ¿Qué es un agente de IA?', o:['Un chat que solo responde','Un sistema con bucle autónomo que usa herramientas','Una base de datos'], c:1},
 {p:'3. ¿Qué significa SDD?', o:['Spec-Driven Development','Software Design Doc.','Standard Data Delivery'], c:0},
 {p:'4. ¿Qué hace el planner en un sistema multiagente?', o:['Edita el código','Diseña la solución','Ejecuta pruebas'], c:1},
 {p:'5. ¿Qué es una alucinación?', o:['Una ruta visual','Cuando el modelo se inventa información','Un error de compilación'], c:1},
 {p:'6. ¿Qué MCP es de GitHub?', o:['Repositorio','GitHub Tools','Chrome DevTools'], c:1},
 {p:'7. ¿Qué temperatura da respuestas más estables?', o:['Alta','Baja','Igual'], c:1},
 {p:'8. ¿Qué contiene un buen prompt?', o:['Solo la pregunta','Rol, contexto, tarea, restricciones, formato','Solo código'], c:1},
];
let sel = {};
function render(){
  let h='';
  preguntas.forEach((q,i)=>{
    h+=`<div class="card"><p><b>${q.p}</b></p>`;
    q.o.forEach((op,j)=>{ h+=`<label style="display:block;margin:6px 0"><input type="radio" name="q${i}" value="${j}" onchange="sel[${i}]=${j}"> ${op}</label>` });
    h+='</div>';
  });
  document.getElementById('quiz').innerHTML=h;
}
function enviar(){
  let pts=0;
  preguntas.forEach((q,i)=>{ if(sel[i]===q.c) pts++; });
  let nivel = pts<=2 ? 'Explorador' : pts<=4 ? 'Practicante' : pts<=6 ? 'Desarrollador asistido' : 'Arquitecto de IA';
  const p = getProgress(); p.diagnostico = nivel; p.puntosDiagnostico = pts; saveProgress(p);
  document.getElementById('resultado').innerHTML = `<h3>🎉 Tu punto de partida</h3><p>Nivel: <b>${nivel}</b> (${pts}/8)</p><p>Recomendación: comienza con el Módulo 1 y avanza por la ruta.</p><a class="btn" href="modulo1/index.html">Ir al Módulo 1</a>`;
}
render();
</script>
</body></html>
