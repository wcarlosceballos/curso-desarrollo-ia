<div class="main"><header><h1>📝 Evaluación</h1></header><main>
<div class="card"><h3>1. ¿Qué es un LLM?</h3>
<button data-ok="1" onclick="resp(this)">Predice el siguiente token por probabilidad</button>
<button onclick="resp(this)">Piensa como una persona</button></div>

<div class="card"><h3>2. ¿Qué MCP prueba tu web en el navegador?</h3>
<button onclick="resp(this)">Figma</button>
<button data-ok="1" onclick="resp(this)">Chrome DevTools</button></div>

<div class="card"><h3>3. ¿Tipo de SDD recomendado?</h3>
<button onclick="resp(this)">Spec-first</button>
<button data-ok="1" onclick="resp(this)">Spec-anchored</button></div>

<div class="card"><h3>4. ¿Qué hace el subagente en SDD?</h3>
<button data-ok="1" onclick="resp(this)">Recibe contexto del coordinador y devuelve resultado</button>
<button onclick="resp(this)">Habla directo con el usuario</button></div>

<p id="res"></p>
</main><footer>OVA educativo — Carlos Ceballos · 2026</footer></div>
<script>
let score=0;
function resp(btn){
  const correct = btn.hasAttribute('data-ok');
  document.getElementById('res').textContent = correct ? '✅ ¡Correcto!' : '❌ Intenta de nuevo';
  if(correct && !btn.dataset.done){ score++; btn.dataset.done='1'; }
  document.getElementById('res').textContent += ' — Puntaje: '+score+'/4';
}
</script>
